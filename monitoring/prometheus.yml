# Prometheus Configuration for TRELLIS2 Monitoring
# File: monitoring/prometheus.yml
#
# Usage: 
#   - Copy to /etc/prometheus/prometheus.yml
#   - Restart Prometheus: systemctl restart prometheus
#   - Or run in Docker: docker run -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'galaxyquest-trellis2'
    environment: 'production'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - 'localhost:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/trellis2.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TRELLIS2 Metrics
  - job_name: 'trellis2'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:8080/api/metrics.php']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # MySQL Database Metrics (if exporter installed)
  - job_name: 'mysql'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9104']

  # Node Exporter (system metrics)
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9100']

  # Docker Metrics (cAdvisor)
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:8081']
