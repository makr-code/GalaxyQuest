# Docker Compose Addition for TRELLIS2 Monitoring
# Add these services to your existing docker-compose.yml
#
# Usage:
#   1. Copy this file content
#   2. Add to your docker-compose.yml under "services:"
#   3. Run: docker-compose up -d prometheus grafana
#   4. Access: 
#      - Prometheus: http://localhost:9090
#      - Grafana: http://localhost:3000 (admin/admin)

services:
  # Prometheus - Time-series database for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    environment:
      - TZ=UTC
    networks:
      - galaxyquest
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    networks:
      - galaxyquest
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - galaxyquest

  # cAdvisor - Docker container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - galaxyquest

  # MySQL Exporter - Database metrics
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter
    ports:
      - "9104:9104"
    environment:
      - DATA_SOURCE_NAME=root:root@tcp(db:3306)/
    command:
      - '--collect.info_schema.innodb_metrics'
      - '--collect.info_schema.processlist'
      - '--collect.info_schema.tablestats'
      - '--collect.perf_schema.file_events'
      - '--collect.perf_schema.eventsstatementssum'
    depends_on:
      - db
    networks:
      - galaxyquest

  # Alertmanager - Alert management (optional)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - galaxyquest

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  galaxyquest:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────
# 
# To use this:
#
# 1. Create monitoring directories:
#    mkdir -p monitoring/grafana/{dashboards,datasources}
#
# 2. Copy prometheus.yml and rules/trellis2.yml
#
# 3. Create monitoring/grafana/datasources/prometheus.yml:
#    apiVersion: 1
#    datasources:
#      - name: Prometheus
#        type: prometheus
#        access: proxy
#        url: http://prometheus:9090
#
# 4. Add to docker-compose.yml (existing file)
#
# 5. Start monitoring stack:
#    docker-compose up -d prometheus grafana node-exporter
#
# 6. Access dashboards:
#    http://localhost:3000
#
# 7. Create dashboards in Grafana using Prometheus datasource
#
# Common metrics to visualize:
#   - trellis2_queued_jobs
#   - trellis2_active_jobs
#   - trellis2_avg_processing_ms
#   - trellis2_cache_hit_ratio
#   - trellis2_success_rate_today
#   - trellis2_storage_used_gb
#   - trellis2_completions_per_hour
#
