ServerName localhost
<VirtualHost *:8443>
    ServerName localhost:8443
    UseCanonicalName On
    DocumentRoot /var/www/html
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /var/lib/gq-local-tls/localhost.crt
    SSLCertificateKeyFile /var/lib/gq-local-tls/localhost.key

    # Native TLS determines HTTPS; never accept a client's proxy assertions.
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset X-Forwarded-Ssl
    RequestHeader unset Front-End-Https
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^localhost:8443$ [NC]
    RewriteRule ^ - [R=400,L]
    RewriteRule ^/?$ /wordpress/ [R=302,L]

    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/wordpress>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        <FilesMatch "(?i)^(wp-config\.php|\.|.*\.(key|pem|json|sql|ini|log))">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog /proc/self/fd/2
    # Do not log credential-bearing query strings or form bodies.
    CustomLog /proc/self/fd/1 "%h %m %U %>s"
</VirtualHost>
