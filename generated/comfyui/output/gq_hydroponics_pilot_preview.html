<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydroponics pilot preview</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #101820; overflow: hidden; }
    #status { position: fixed; top: 12px; left: 12px; color: white; font: 14px sans-serif; z-index: 1; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Loading hydroponics pilot…</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const status = document.getElementById('status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101820);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xddeeff, 0x303040, 2));
    const key = new THREE.DirectionalLight(0xffffff, 3);
    key.position.set(3, 5, 4);
    scene.add(key);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = false;
    window.__gqCamera = camera;
    window.__gqControls = controls;
    new GLTFLoader().load(
      '/generated/comfyui/output/gq_hydroponics_pilot_v2_normals.glb',
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);
        const bounds = new THREE.Box3().setFromObject(model);
        const center = bounds.getCenter(new THREE.Vector3());
        const size = bounds.getSize(new THREE.Vector3());
        const distance = Math.max(size.length() * 1.65, 1.5);
        camera.position.copy(center).add(new THREE.Vector3(distance, distance * 0.65, distance));
        camera.lookAt(center);
        camera.near = distance / 100;
        camera.far = distance * 100;
        camera.updateProjectionMatrix();
        controls.target.copy(center);
        controls.update();
        window.__gqCenter = center;
        window.__gqSize = size;
        status.textContent = `Loaded: ${gltf.scene.children.length} root objects`;
        window.__gqReady = true;
      },
      undefined,
      (error) => {
        status.textContent = `Load failed: ${error.message}`;
        window.__gqError = String(error);
      }
    );
    function render() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }
    render();
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
