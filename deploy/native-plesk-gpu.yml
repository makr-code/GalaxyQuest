services:
  comfyui:
    image: ${GPU_IMAGE:?Set a digest-pinned GPU_IMAGE}
    restart: unless-stopped
    init: true
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /workspace/models/huggingface
      SPARSE_CONV_BACKEND: spconv
      SPCONV_ALGO: native
    ports:
      - "127.0.0.1:${COMFYUI_PORT:?Set a dedicated COMFYUI_PORT}:8188"
    volumes:
      - gpu-models:/workspace/models
      - gpu-input:/workspace/input
      - gpu-output:/workspace/output
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  gpu-models:
  gpu-input:
  gpu-output:
