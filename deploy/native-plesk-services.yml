services:
  tts:
    image: ${TTS_IMAGE:?Set a digest-pinned TTS_IMAGE}
    restart: unless-stopped
    init: true
    environment:
      TTS_SECRET: ${TTS_SECRET:?Set a non-empty TTS_SECRET}
      TTS_ENGINE: ${TTS_ENGINE:-piper}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test "$${#TTS_SECRET}" -ge 32 || { echo "TTS_SECRET must have at least 32 characters" >&2; exit 1; }
        exec uvicorn main:app --host 0.0.0.0 --port 5500
    ports:
      - "127.0.0.1:${TTS_PORT:?Set a dedicated TTS_PORT}:5500"
    volumes:
      - tts-voices:/app/voice_cache
      - tts-audio:/app/audio_cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  tts-voices:
  tts-audio:
