      Nebula Color: {nebula_color}
      Biomask Definition: {biomask_definition}%
      Ethereal Luminescence: {ethereal_luminescence}%
      Shadow Specialization: {shadow_specialization}
      
      Specifications:
      - Flowing gas-form hull with semi-solid biomask avatar, {ship_length}m
      - Asymmetric mysterious contours with ghost-like appearance
      - Dimension-shifting ethereal propulsion
      - Phase-disruption and dimensional-breach weapons
      - Shadowy observation nexuses with reality-sensing arrays
      - Swirling gas patterns with soft nebula luminescence
      - Semi-transparent form suggesting vast hidden depths
      
      Visual Style: Ethereal mystery and flowing beauty. Ghost-like and barely-there presence.
      Material Language: Soft swirling nebula clouds in smoke-gray and lavendel, semi-solid biomask avatar.
      Aesthetic Philosophy: Form hints at vast cosmic intelligence. Elusive and profoundly mysterious.
      Purpose: Shadow intelligence, cosmic observer, mystery keeper vessel

# ═══════════════════════════════════════════════════════════════════════════════
# CUSTOMIZATION ENHANCEMENT GUIDES
# ═══════════════════════════════════════════════════════════════════════════════

enhancement_patterns:
  weathering:
    description: "Add age and battle-worn characteristics"
    display_name: "⚔️ Weathering & Age"
    parameters:
      - age_level:
          type: "slider"
          range: [0, 100]
          description: "0=brand new, 100=ancient relic"
      - damage_intensity:
          type: "slider"
          range: [0, 100]
          description: "0=pristine, 100=extensively battle-scarred"
      - patina_type:
          type: "choice"
          options: ["rust-oxidation", "corrosion-patina", "bio-growth", "crystalline-decay", "energy-erosion"]
          description: "Type of aging/decay specific to species material"
    affects_prompt: "Apply {age_level}% natural aging with {damage_intensity}% battle damage and {patina_type} patina formation"
    
  faction_customization:
    description: "Add faction-specific insignia, ranks, and honors"
    display_name: "🏆 Faction Customization"
    parameters:
      - faction_name:
          type: "choice"
          options: ["Vor'Tak Command", "Syl'Nar Collective", "Aereth Research", "Kryl'Tha Swarm", "Zhareen Archive", "Vel'Ar Shadow"]
          description: "Faction colors and insignia style"
      - rank_insignia:
          type: "choice"
          options: ["Recruit", "Officer", "Commander", "Admiral", "War-Chief", "Legendary"]
          description: "Military rank affects insignia complexity and placement"
      - honor_markings:
          type: "text"
          description: "Custom achievement marks or campaign honors"
    affects_prompt: "Add {faction_name} faction insignia, {rank_insignia} rank markings, and {honor_markings} achievement stripes"
    
  special_purpose:
    description: "Optimize design for specific ship role and mission profile"
    display_name: "🎯 Special Purpose Roles"
    options:
      scout:
        description: "Minimal armor, sensor-heavy, maximum agility"
        prompt_additions: "Optimized for reconnaissance with advanced sensor arrays, sleek aerodynamic profile, minimal weapons. Emphasis on speed and stealth."
      
      carrier:
        description: "Massive cargo bay, reinforced hull, moderate weapons"
        prompt_additions: "Large internal hangar capacity, reinforced structural beams, slower but capable of carrying fighter squadrons. Cargo-optimized geometry."
      
      battleship:
        description: "Maximum armor, heavy weapons, intimidating silhouette"
        prompt_additions: "Heavy armor plating, prominent weapon arrays, commanding presence. Every surface suggests overwhelming firepower and durability."
      
      explorer:
        description: "Advanced sensors, moderate defenses, scientific instruments"
        prompt_additions: "Extended sensor arrays, lab compartments, advanced spectrographic equipment. Built for discovery and data collection."
      
      colony_ship:
        description: "Massive habitat, self-sufficient, civilian-optimized"
        prompt_additions: "Extensive living quarters, agricultural domes, life support emphasis. Designed for long-term habitation and colony establishment."
      
      logistics:
        description: "Supply transport, processing centers, resupply capability"
        prompt_additions: "Large cargo processing centers, fuel transfer ports, supply distribution nodes. Industrial appearance emphasizing cargo capacity."
    
    affects_prompt: "Design optimized for {special_purpose} role with {special_purpose_specific_modifications}"

  model_detail_enhancement:
    description: "Increase geometric detail and polygonal complexity of 3D model"
    display_name: "🔍 Model Detail Level"
    parameters:
      - detail_level:
          type: "choice"
          options: ["low-poly", "standard", "high-detail", "ultra-hd", "extreme"]
          description: "Polygonal complexity and geometric resolution"
      - surface_complexity:
          type: "slider"
          range: [0, 100]
          default: 50
          description: "Add micro-details, panel lines, rivets, seams, surface imperfections"
      - structural_emphasis:
          type: "choice"
          options: ["smooth-organic", "engineered-precision", "bio-mechanical", "crystalline-faceted", "energy-channeled"]
          description: "Structural style affects detail interpretation"
    affects_prompt: "Increase geometric detail to {detail_level} with {surface_complexity}% micro-detailing. Use {structural_emphasis} structural approach for detail placement."
    
  texture_material_enhancement:
    description: "Add material properties, wear patterns, and texture variation"
    display_name: "🎨 Texture & Material"
    parameters:
      - texture_resolution:
          type: "choice"
          options: ["1k", "2k", "4k", "8k"]
          default: "2k"
          description: "Texture map resolution (1024px to 8192px)"
      - material_variety:
          type: "slider"
          range: [0, 100]
          default: 50
          description: "Blend between different materials (metal/organic/crystal/energy)"
      - weathering_pattern:
          type: "choice"
          options: ["uniform", "edge-wear", "directional-erosion", "environmental-patina", "combat-scarring"]
          description: "How weathering appears across surface"
      - surface_properties:
          type: "choice"
          options: ["matte", "satin", "glossy", "metallic-reflective", "bioluminescent", "energy-plasma"]
          description: "Surface finish and reflectance properties"
    affects_prompt: "Apply {texture_resolution} texture resolution with {material_variety}% multi-material variation. Use {weathering_pattern} weathering pattern and {surface_properties} surface finish."
    
  bioluminescence_glow_enhancement:
    description: "Add glowing effects, energy flows, and light emission"
    display_name: "✨ Glow & Light Emission"
    parameters:
      - glow_intensity:
          type: "slider"
          range: [0, 100]
          default: 50
          description: "Brightness of emissive surfaces (0=none, 100=blinding)"
      - glow_coverage:
          type: "slider"
          range: [0, 100]
          default: 30
          description: "Percentage of hull covered by glowing elements"
      - energy_flow_pattern:
          type: "choice"
          options: ["static-nodes", "pulsing-rhythm", "flowing-streams", "arc-patterns", "harmonic-resonance"]
          description: "How energy/light appears to flow or pulse"
      - glow_color_variation:
          type: "choice"
          options: ["monochromatic", "complementary-dual", "spectrum-rainbow", "complex-palette"]
          description: "Color complexity of glow effects"
    affects_prompt: "Add bioluminescence/glow with {glow_intensity}% intensity covering {glow_coverage}% of surface using {energy_flow_pattern} pattern in {glow_color_variation} color scheme."
    
  armor_plating_enhancement:
    description: "Add plating, panel lines, armor segmentation, and hull structure"
    display_name: "🛡️ Armor & Plating"
    parameters:
      - plating_scale:
          type: "slider"
          range: [1, 100]
          default: 50
          description: "Size of armor plates and panel segments (large=few big plates, small=intricate segmentation)"
      - plating_definition:
          type: "slider"
          range: [0, 100]
          default: 60
          description: "Depth and visibility of seams, gaps, and panel edges"
      - armor_style:
          type: "choice"
          options: ["overlapping-scales", "interlocking-hexagonal", "angular-facets", "organic-flow", "crystalline-lattice"]
          description: "Arrangement pattern of armor segments"
      - structural_reinforcement:
          type: "slider"
          range: [0, 100]
          default: 40
          description: "Add visible reinforcement beams, struts, and internal structure hints"
    affects_prompt: "Add armor plating with {plating_scale}% scale and {plating_definition}% definition using {armor_style} arrangement. Include {structural_reinforcement}% visible structural reinforcement."
    
  particle_effects_enhancement:
    description: "Add particle systems, exhaust trails, and environmental effects"
    display_name: "💨 Particle Effects"
    parameters:
      - exhaust_intensity:
          type: "slider"
          range: [0, 100]
          default: 50
          description: "Density and visibility of engine exhaust/propulsion trails"
      - particle_types:
          type: "choice"
          options: ["ion-plasma", "chemical-smoke", "energy-discharge", "bio-spores", "crystalline-shards"]
          description: "Type of particles emitted by ship systems"
      - effect_density:
          type: "slider"
          range: [0, 100]
          default: 50
          description: "Overall density of particle systems and visual effects"
      - environmental_interaction:
          type: "choice"
          options: ["no-interaction", "subtle-wind", "turbulent-streams", "environmental-reaction", "dimensional-distortion"]
          description: "How particles interact with environment"
    affects_prompt: "Add particle effects with {exhaust_intensity}% exhaust intensity, {particle_types} particle type, and {effect_density}% overall density. Use {environmental_interaction} environmental interaction."
    
  color_grading_enhancement:
    description: "Apply color scheme adjustments, saturation, and tone"
    display_name: "🎭 Color Grading"
    parameters:
      - saturation_level:
          type: "slider"
          range: [0, 150]
          default: 100
          description: "Color saturation (0=grayscale, 100=normal, 150=hyper-saturated)"
      - color_temperature:
          type: "choice"
          options: ["cool-blue", "neutral", "warm-orange", "alien-purple", "exotic-cyan"]
          description: "Overall color temperature and tone"
      - contrast_level:
          type: "slider"
          range: [0.5, 2.0]
          default: 1.0
          description: "Contrast between light and dark areas (0.5=flat, 1.0=normal, 2.0=high-contrast)"
      - special_color_effects:
          type: "choice"
          options: ["none", "iridescent-shift", "holographic", "thermal-vision", "spectral-analysis"]
          description: "Special color processing effects"
    affects_prompt: "Apply color grading with {saturation_level}% saturation, {color_temperature} color temperature, {contrast_level}x contrast, and {special_color_effects} special effects."

