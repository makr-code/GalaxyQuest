# ═══════════════════════════════════════════════════════════════════════════════
# TRELLIS2 Species Design Templates for 3D Model Generation
# Based on GalaxyQuest LoRA Training Guide & Art Prompts SDXL (docs/lore/)
# LLM Wiki Pattern: Base Specification + User Customization + Iterative Enhancement
# ═══════════════════════════════════════════════════════════════════════════════

species:
  # ─────────────────────────────────────────────────────────────────────────────
  # VOR'TAK - Reptiloide Strategen
  # Ref: docs/lore/LORA_TRAINING_GUIDE.md §5, docs/lore/ART_PROMPTS_SDXL.md
  # ─────────────────────────────────────────────────────────────────────────────
  vortak:
    display_name: "Vor'Tak"
    base_concept: "Massive reptilian strategists with predatory intelligence"
    faction_origin: "Military commanders, tactical masterminds"
    lora_trigger_word: "vortak_race"
    lora_recommended_weight: 0.85
    
    morphology:
      base_form: "bipedal reptilian, heavily muscled"
      height_cm: [195, 230]
      body_mass_ratio: 1.3
      facial_features: "sharp angular structure, strong jaw, slit pupils in yellow"
      scale_variations: ["dark green-black", "emerald with gold", "bronze-dark", "teal-iridescent"]
      scale_traits: ["iridescent", "battle-scarred", "bone-plated", "rigid armor-like"]
      symmetry: "bilateral with dorsal bone ridges"
      
    aesthetic_principles:
      primary_philosophy: "predatory efficiency, battle-hardened majesty"
      material_preference: ["bronze-metal", "scale-derived armor", "bone-plating", "war-forged steel"]
      color_palette: ["dark greens", "bronze-gold", "deep teals", "rust-reds from battle"]
      texture_traits: ["heavy scale plating", "massive bone structures", "battle scars", "metallic accents"]
      era_reference: "ancient warrior kingdoms meets modern warfare"
      cultural_markers: ["honor-scars and ridges", "brass insignia", "commander plates"]
      
    ship_design_archetype:
      hull_shape: "aggressive wedge-forward, predatory silhouette"
      propulsion_style: "powerful twin nacelles, thermal-aggressive glow"
      weapon_integration: "heavy armor plating, dominant dorsal ridge weapons"
      windows_ports: "narrow predatory slits, minimal viewports"
      color_scheme: "dark scale-green with bronze and gold accents"
      size_range: [120, 420]  # meters
      design_tags: ["militaristic", "predatory", "battle-hardened", "dominant", "ancient"]
      
    customization_points:
      - name: "scale_coloration"
        type: "color"
        default: "#1a4d2e"
        description: "Primary scale color with iridescent undertones"
        affects: ["hull_base_color", "light_reflection_patterns", "visual_age"]
        
      - name: "metallic_accents"
        type: "color"
        default: "#c9a961"
        description: "Brass/bronze armor accent color"
        affects: ["armor_plating_color", "insignia_color", "authority_appearance"]
        
      - name: "battle_scars_intensity"
        type: "slider"
        range: [0, 100]
        default: 45
        description: "How heavily battle-damaged the ship appears"
        affects: ["scar_patterns", "armor_dents", "survival_appearance"]
        
      - name: "commander_rank"
        type: "choice"
        options: ["squadron-leader", "general", "admiral", "war-chief", "legendary-veteran"]
        affects: ["insignia_placement", "rank_markings", "overall_authority"]
        
      - name: "age_and_honor"
        type: "slider"
        range: [0, 100]
        default: 30
        description: "Accumulated age, scars, and honors (0=young warrior, 100=ancient legend)"
        affects: ["weathering_patterns", "patina_accumulation", "gravitas_appearance"]
        
    prompt_template: |
      3D warship design: {ship_name}
      Species Origin: Vor'Tak (massive reptilian strategists)
      Scale Color: {scale_coloration}
      Metallic Accent: {metallic_accents}
      Commander Rank: {commander_rank}
      Battle Scars: {battle_scars_intensity}%
      Age & Honor Level: {age_and_honor}%
      
      Specifications:
      - Predatory wedge-forward hull shape
      - Length: {ship_length}m, muscular twin-nacelle propulsion
      - Heavy dorsal-ridge weapon arrays
      - Massive scale-derived armor plating with bronze reinforcements
      - Battle-scarred hull with accumulated honor marks
      - Thermal-aggressive engine glow indicating raw power
      
      Visual Style: Ancient warrior kingdom meets advanced warfare. Reptilian predatory excellence.
      Material Language: Bronze-gold metallic accents on dark scale-green armor. Bone-white ridge weapons.
      Aesthetic Philosophy: Form follows predatory function. Every surface speaks of dominance and battle-proven tactics.
      Purpose: Tactical command vessel, apex predator of the galaxy
      
  # ─────────────────────────────────────────────────────────────────────────────
  # SYL'NAR - Cephalopodische Mystiker
  # Ref: docs/lore/LORA_TRAINING_GUIDE.md §5, docs/lore/ART_PROMPTS_SDXL.md
  # ─────────────────────────────────────────────────────────────────────────────
  sylnar:
    display_name: "Syl'Nar"
    base_concept: "Mystical cephalopod intelligences with bioluminescent wonder"
    faction_origin: "Spiritual leaders, cosmic explorers, empathic diplomats"
    lora_trigger_word: "sylnar_race"
    lora_recommended_weight: 0.80
    
    morphology:
      base_form: "cephalopod, graceful flowing tentacles"
      height_cm: [175, 215]
      body_mass_ratio: 0.8
      facial_features: "expressive alien eyes, spiritual depth, cosmic swirls"
      skin_variations: ["translucent-cyan", "pastel-blue", "perlmut-iridescent", "luminous-white"]
      tentacle_traits: ["flowing graceful", "pulsing bioluminescence", "sensory-detailed", "ethereal"]
      symmetry: "radial with flowing tentacle grace"
      
    aesthetic_principles:
      primary_philosophy: "spiritual harmony, cosmic wonder, empathic connection"
      material_preference: ["bio-membrane", "luminescent-crystal", "water-sealed-composite", "living-light"]
      color_palette: ["neon cyan", "pastel blues", "perlmut reflections", "luminous pinks"]
      texture_traits: ["translucent softness", "pulsing bioluminescence", "flowing curves", "wet appearance"]
      era_reference: "transcendent spirituality meets advanced alien biology"
      cultural_markers: ["meditation chambers", "harmonic resonance nodes", "wisdom-stones"]
      
    ship_design_archetype:
      hull_shape: "organic flowing curves, bio-form, asymmetric beauty"
      propulsion_style: "bioluminescent jets, pulsing muscle-like propulsion"
      weapon_integration: "harmonic disruption fields, sonic projectors"
      windows_ports: "luminescent observation domes, bio-optical arrays"
      color_scheme: "deep blues with cyan and pink bioluminescent accents"
      size_range: [90, 380]  # meters
      design_tags: ["organic", "spiritual", "luminous", "flowing", "mystical"]
      
    customization_points:
      - name: "bioluminescence_color"
        type: "color"
        default: "#00ffdd"
        description: "Primary bioluminescence glow color"
        affects: ["glow_color", "energy_trail_color", "mystical_appearance"]
        
      - name: "translucency_level"
        type: "slider"
        range: [0, 100]
        default: 60
        description: "How transparent/translucent the hull appears"
        affects: ["hull_transparency", "internal_glow_visibility", "ethereal_quality"]
        
      - name: "spiritual_alignment"
        type: "choice"
        options: ["peaceful-healer", "wise-mentor", "cosmic-seeker", "harmonic-guide", "transcendent"]
        affects: ["color_warmth", "glow_rhythm", "spiritual_presence"]
        
      - name: "tentacle_complexity"
        type: "slider"
        range: [0, 100]
        default: 50
        description: "Visual complexity of flowing tentacle structures"
        affects: ["hull_appendage_detail", "sensory_complexity", "organic_appearance"]
        
    prompt_template: |
      3D bioship design: {ship_name}
      Species Origin: Syl'Nar (cephalopod mystics)
      Bioluminescence Color: {bioluminescence_color}
      Translucency Level: {translucency_level}%
      Spiritual Alignment: {spiritual_alignment}
      Tentacle Complexity: {tentacle_complexity}%
      
      Specifications:
      - Organic flowing bio-form hull, {ship_length}m
      - Graceful asymmetric tentacle-like structures
      - Pulsing bioluminescent propulsion systems
      - Harmonic resonance disruption weapons
      - Semi-transparent membrane hull with internal luminescence
      - Cosmic-scale sensory observation arrays
      
      Visual Style: Transcendent spirituality in living form. Bioluminescent wonder and cosmic empathy.
      Material Language: Flowing bio-membranes with pulsing luminescent patterns in cyan and pink.
      Aesthetic Philosophy: Form flows with grace and spiritual purpose. Every surface resonates with cosmic connection.
      Purpose: Diplomatic explorer, spiritual guide, cosmic seeker vessel
      
  # ─────────────────────────────────────────────────────────────────────────────
  # AERETH - Humanoide Energiewesen
  # Ref: docs/lore/LORA_TRAINING_GUIDE.md §5, docs/lore/ART_PROMPTS_SDXL.md
  # ─────────────────────────────────────────────────────────────────────────────
  aereth:
    display_name: "Aereth"
    base_concept: "Pure energy consciousnesses inhabiting crystalline humanoid forms"
    faction_origin: "Scientists, researchers, knowledge-seekers, enlightened minds"
    lora_trigger_word: "aereth_race"
    lora_recommended_weight: 0.80
    
    morphology:
      base_form: "humanoid crystalline, energy-based, translucent"
      height_cm: [170, 200]
      body_mass_ratio: 0.4
      facial_features: "angular crystalline structure, glowing energy core, refracted geometry"
      energy_variations: ["cool white-blue", "silver-electric", "warm golden-white", "violet-ethereal"]
      glow_traits: ["intense internal luminescence", "crackling electricity", "refractive light", "energy tendrils"]
      symmetry: "geometric perfection with energy flow"
      
    aesthetic_principles:
      primary_philosophy: "energy efficiency, geometric enlightenment, pure intellect"
      material_preference: ["quantum-flux crystal", "energy-lattice", "refraction-optimized", "harmonic-resonance"]
      color_palette: ["brilliant whites", "electric blues", "silver-sparks", "warm golds"]
      texture_traits: ["sharp crystalline surfaces", "smooth energy flows", "light refraction", "geometric precision"]
      era_reference: "far-future energy-tech, scientific transcendence"
      cultural_markers: ["research labs", "knowledge archives", "harmonic resonators"]
      
    ship_design_archetype:
      hull_shape: "geometric crystalline, precision-engineered angles"
      propulsion_style: "energy-field driven, crackling electromagnetic glow"
      weapon_integration: "energy beam projectors, photon cannons"
      windows_ports: "transparent energy observation crystals"
      color_scheme: "brilliant whites/silvers with electric blue and golden accents"
      size_range: [80, 350]  # meters
      design_tags: ["geometric", "energy-based", "brilliant", "enlightened", "precise"]
      
    customization_points:
      - name: "energy_color"
        type: "color"
        default: "#00ccff"
        description: "Primary energy glow color"
        affects: ["glow_color", "energy_trail_color", "intellectual_appearance"]
        
      - name: "geometric_precision"
        type: "slider"
        range: [0, 100]
        default: 75
        description: "How geometrically precise vs organic-flowing"
        affects: ["hull_angularity", "surface_precision", "crystalline_appearance"]
        
      - name: "research_specialization"
        type: "choice"
        options: ["theoretical-physics", "biology-study", "cosmology-explorer", "technology-fusion", "universal-knowledge"]
        affects: ["instrument_configuration", "research_appearance", "knowledge_markers"]
        
      - name: "energy_intensity"
        type: "slider"
        range: [0, 100]
        default: 70
        description: "How brightly the energy glows and crackles"
        affects: ["luminescence_level", "glow_radius", "electromagnetic_appearance"]
        
    prompt_template: |
      3D crystal-ship design: {ship_name}
      Species Origin: Aereth (energy-consciousness)
      Primary Energy Color: {energy_color}
      Geometric Precision: {geometric_precision}%
      Energy Intensity: {energy_intensity}%
      Research Specialization: {research_specialization}
      
      Specifications:
      - Crystalline geometric hull with energy core, {ship_length}m
      - Refracted light patterns creating hypnotic beauty
      - Electromagnetic energy propulsion with crackling trails
      - Photon-based research and defense systems
      - Semi-transparent energy observation chambers
      - Internal luminescence revealing pure intellectual power
      
      Visual Style: Geometric transcendence meets pure energy manifestation. Brilliant and precise.
      Material Language: Sharp crystalline surfaces with smooth flowing energy, white-silver-blue coloring.
      Aesthetic Philosophy: Every surface reveals brilliant intellect. Form follows function perfectly.
      Purpose: Research explorer, scientific seeker, enlightenment vessel
      
  # ─────────────────────────────────────────────────────────────────────────────
