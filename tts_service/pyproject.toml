[project]
name = "galaxyquest-tts"
version = "1.0.0"
description = "GalaxyQuest TTS Microservice – Piper / Coqui XTTS FastAPI service"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901", "EXE001"]

[tool.ruff.lint.isort]
known-first-party = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
pythonpath = ["."]
