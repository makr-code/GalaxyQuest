code: trading_chain
title_template: "Execute trade route: {from_location} → {to_location}"
description_template: |
  Establish a profitable trade route from {from_location} to {to_location}.
  Execute at least {num_trades} successful trades to complete the mission.
  Estimated profit per run: {expected_profit} credits.
quest_type: deliver
difficulty_modifier: 1.3
faction_types:
  - trade
  - envoy
default_params:
  from_location: "industrial_hub"
  to_location: "consumer_colony"
  num_trades: 3
  expected_profit: 5000
  trade_deadline_days: 21
  cargo_requirement: "diverse"
reward_scaling:
  base_metal: 400
  base_crystal: 400
  base_standing: 6
  multipliers:
    by_profit: 0.0001
    by_difficulty: 1.3
narrative_hooks:
  - "Commerce is the lifeblood of civilization. Keep it flowing."
  - "Profit awaits those with the courage to trade."
  - "We reward our partners generously. Show us your trading skill."
