# .github/workflows/ci.yml
#
# GalaxyQuest — Main CI/CD Pipeline
#
# Runs on every push to supported branches and on every pull request.
#
# Jobs:
#   lint-php         — PHP syntax, counted PSR-12 baseline and PHPStan Level 5
#   lint-js          — ESLint with Galaxy architecture rules
#   phpunit-unit     — Database-independent PHPUnit unit tests (SQLite)
#   phpunit          — Complete PHPUnit suite (PHP 8.2 + MySQL 8.4 service)
#   vitest           — Vitest JavaScript unit tests
#   native-db        — PHP 8.4 / MariaDB 11.8 native database compatibility
#   playwright-smoke — Playwright smoke test (isolated built web image + database)
#   docker-build     — Build, scan and publish web/TTS images (develop/main)

name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

# Default: restrict all jobs to read-only access; individual jobs that need
# extra permissions (e.g. docker-build → packages: write) override this.
permissions:
  contents: read

jobs:
  # ── PHP Syntax, Style and Static Analysis ────────────────────────────────────
  lint-php:
    name: PHP Syntax, PSR-12 and PHPStan Level 5
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, tokenizer, xmlwriter
          coverage: none

      - name: Lint PHP syntax
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './tools/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Reject new PHPStan Level 5 findings
        run: composer analyse

      - name: Reject new and stale PHPCS PSR-12 findings
        run: composer lint:php

  # ── JavaScript Architecture Linting ─────────────────────────────────────────
  lint-js:
    name: JavaScript Architecture Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript and enforce sanitization baseline
        run: npm run lint:js

      - name: Reject generated texture caches and oversized Git blobs
        run: npm run check:repository-artifacts

      - name: Validate canonical version and changelog metadata
        run: npm run check:release-metadata

      - name: Reject rewritten migration history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$MIGRATION_BASE" =~ ^0+$ ]]; then
            MIGRATION_BASE=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
          fi
          npm run check:migration-history -- --base "$MIGRATION_BASE"

      - name: Verify Docker context and native Plesk service contracts
        env:
          GQ_DOCKER_CONTEXT_TESTS: '1'
        run: npx vitest run tests/js/docker-context.test.js tests/js/ci-stack.test.js tests/js/native-plesk-services.test.js tests/js/native-release-package.test.js --testTimeout=30000 --hookTimeout=150000

  phpunit-unit:
    name: PHPUnit Unit Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run database-independent unit tests
        run: vendor/bin/phpunit --testsuite "GalaxyQuest Unit" --no-coverage --do-not-cache-result --fail-on-warning --fail-on-risky --fail-on-phpunit-deprecation

  # ── PHP Tests with MySQL ────────────────────────────────────────────────────
  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: galaxyquest
          MYSQL_USER: galaxyquest_user
          MYSQL_PASSWORD: galaxyquest_dev
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Test MigrationRunner against isolated MySQL databases
        env:
          GQ_MIGRATION_TEST_DSN: "mysql:host=127.0.0.1;port=3306;charset=utf8mb4"
          GQ_MIGRATION_TEST_USER: root
          GQ_MIGRATION_TEST_PASSWORD: root
          NPC_LLM_ASYNC_QUEUE_ENABLED: "1"
        run: vendor/bin/phpunit tests/Integration/MigrationRunnerMySqlTest.php --no-coverage --do-not-cache-result --fail-on-warning --fail-on-risky --fail-on-phpunit-deprecation

      - name: Test resource and fleet concurrency against isolated MySQL
        env:
          GQ_RESOURCE_LEDGER_TEST_DSN: "mysql:host=127.0.0.1;port=3306;charset=utf8mb4"
          GQ_RESOURCE_LEDGER_TEST_USER: root
          GQ_RESOURCE_LEDGER_TEST_PASSWORD: root
        run: vendor/bin/phpunit tests/Integration/ResourceLedgerConcurrencyTest.php tests/Integration/ResourceMutationApiConcurrencyTest.php tests/Integration/FleetMySqlConcurrencyTest.php --no-coverage --do-not-cache-result --fail-on-warning --fail-on-risky --fail-on-phpunit-deprecation

      - name: Initialise database schema and migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: galaxyquest
          DB_USER: galaxyquest_user
          DB_PASS: galaxyquest_dev
        run: |
          mysql -h 127.0.0.1 -u galaxyquest_user -pgalaxyquest_dev galaxyquest \
            < sql/schema.sql
          php scripts/migrate.php up --env=TEST
          php scripts/migrate.php status

      - name: Run PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: galaxyquest
          DB_USER: galaxyquest_user
          DB_PASS: galaxyquest_dev
        run: vendor/bin/phpunit --no-coverage --fail-on-warning --fail-on-risky --fail-on-phpunit-deprecation

  # ── JavaScript Unit Tests ───────────────────────────────────────────────────
  vitest:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run Vitest
        run: npx vitest run --reporter=verbose --testTimeout=15000 --hookTimeout=30000

      - name: Build production frontend
        run: npm run vite:build

      - name: Enforce JavaScript bundle budget
        run: npm run check:bundle-budget

      - name: Ensure production build has no source maps
        run: |
          if [ -n "$(find dist -type f -name '*.map' -print -quit)" ]; then
            echo "Production build unexpectedly contains source maps." >&2
            exit 1
          fi

  # ── End-to-End Smoke Test ───────────────────────────────────────────────────
  playwright-smoke:
    name: Playwright E2E Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: gq-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Verify browser lifecycle resource cleanup
        run: npx playwright test tests/e2e/lifecycle-resources.spec.js tests/e2e/game-view-lifecycle.spec.js --project=chromium --workers=1 --reporter=list

      - name: Start application stack (web + db, AI services disabled)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait web db
        timeout-minutes: 10

      - name: Check live but not ready before canonical migrations
        env:
          GQ_HEALTH_HTTP_TESTS: '1'
          GQ_HEALTH_EXPECT_READY: '0'
          GQ_BASE_URL: http://localhost:8081
        run: npx vitest run tests/js/health-http.test.js --testTimeout=10000

      - name: Apply canonical migrations from the built image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T web php scripts/migrate.php up --env=TEST
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T web php scripts/migrate.php up --env=TEST
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T web php scripts/migrate.php status
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T web php scripts/migrate.php verify --env=TEST

      - name: Require application DB readiness after migrations
        env:
          GQ_HEALTH_HTTP_TESTS: '1'
          GQ_HEALTH_EXPECT_READY: '1'
          GQ_BASE_URL: http://localhost:8081
        run: |
          curl --fail --silent --show-error --max-time 5 http://localhost:8081/health/live
          curl --fail --silent --show-error --max-time 5 http://localhost:8081/health/ready
          npx vitest run tests/js/health-http.test.js --testTimeout=10000

      - name: Reject PHP and Apache version disclosure
        run: |
          headers="$(curl --fail --silent --show-error --max-time 5 -D - -o /dev/null http://localhost:8081/health/live)"
          if printf '%s\n' "$headers" | grep -Eiq '^X-Powered-By:'; then
            echo "PHP version disclosure detected in X-Powered-By." >&2
            exit 1
          fi
          if printf '%s\n' "$headers" | grep -Eiq '^Server:.*[0-9]'; then
            echo "Web server version disclosure detected in Server." >&2
            exit 1
          fi

      - name: Require browser security headers on HTML and API responses
        run: |
          for url in http://localhost:8081/ http://localhost:8081/health/live; do
            headers="$(curl --fail --silent --show-error --max-time 5 -D - -o /dev/null "$url")"
            for expected in \
              '^X-Frame-Options: DENY' \
              '^X-Content-Type-Options: nosniff' \
              '^Referrer-Policy: strict-origin-when-cross-origin' \
              '^Permissions-Policy: camera=\(\), geolocation=\(\), microphone=\(\)'; do
              if ! printf '%s\n' "$headers" | grep -Eiq "$expected"; then
                echo "Missing browser security response header matching: $expected ($url)" >&2
                exit 1
              fi
            done
          done

      - name: Seed E2E test user
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T web php scripts/ensure_default_e2e_user.php --skip-bootstrap \
            --username=default_user \
            --password=User!23456 \
            --email=default_user@local.test

      - name: Verify developer blog withdrawal and narration recovery
        env:
          GQ_BASE_URL: http://localhost:8081
        run: npx playwright test tests/e2e/developer-blog.spec.js --project=chromium --workers=1 --reporter=list

      - name: Run view-flow smoke test
        env:
          GQ_BASE_URL: http://localhost:8081
        run: |
          npx playwright test tests/e2e/view-flow.spec.js \
            --reporter=list \
            --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Capture isolated stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color web db

      - name: Remove isolated CI stack and volumes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes --remove-orphans

  native-db:
    name: Native PHP 8.4 and MariaDB 11.8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Check isolated schema, migrations, database isolation and restore
        run: npm run check:native-db-compatibility

  docker-build:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    # Never publish PR images or deploy untrusted pull request code.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [lint-php, lint-js, phpunit-unit, phpunit, vitest, playwright-smoke, native-db]
    outputs:
      web-image: ${{ steps.release.outputs.web-image }}
      tts-image: ${{ steps.release.outputs.tts-image }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local candidate without publishing
        id: candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: galaxyquest:publish-candidate
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan exact candidate before registry authentication
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: galaxyquest:publish-candidate
          format: table
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Build TTS candidate without publishing
        id: tts
        uses: docker/build-push-action@v6
        with:
          context: ./tts_service
          load: true
          push: false
          tags: galaxyquest-tts:publish-candidate

      - name: Scan exact TTS candidate before registry authentication
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: galaxyquest-tts:publish-candidate
          format: table
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Set up Node.js for production stack acceptance
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Accept exact production web and TTS candidates on a fresh database
        env:
          GQ_TEST_WEB_IMAGE: galaxyquest:publish-candidate
          GQ_TEST_TTS_IMAGE: galaxyquest-tts:publish-candidate
        run: |
          docker pull mysql:8.4
          docker pull axllent/mailpit:v1.29
          node scripts/check_production_stack.mjs
          node scripts/check_smtp_delivery.mjs
          node scripts/check_wordpress_routing.mjs

      - name: Prepare native Plesk candidate from the accepted image
        env:
          CANDIDATE_ID: ${{ steps.candidate.outputs.imageid }}
        run: |
          bash deploy/package-native-release.sh "$CANDIDATE_ID" "$GITHUB_SHA" "$RUNNER_TEMP/native-plesk-candidate.tar.gz"

      - name: Preserve non-deployable native candidate
        uses: actions/upload-artifact@v4
        with:
          name: native-plesk-candidate
          path: ${{ runner.temp }}/native-plesk-candidate.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GitHub Container Registry after scan
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push only the scanned candidate without rebuilding
        env:
          CANDIDATE_ID: ${{ steps.candidate.outputs.imageid }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$CANDIDATE_ID"
          test -n "$IMAGE_TAGS"
          test "$(docker image inspect --format '{{.Id}}' galaxyquest:publish-candidate)" = "$CANDIDATE_ID"
          while IFS= read -r tag; do
            test -n "$tag"
            docker tag "$CANDIDATE_ID" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Publish scanned TTS and resolve immutable release references
        id: release
        env:
          TTS_ID: ${{ steps.tts.outputs.imageid }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$TTS_ID"
          test "$(docker image inspect --format '{{.Id}}' galaxyquest-tts:publish-candidate)" = "$TTS_ID"
          repository="${IMAGE_REPOSITORY,,}"
          tts_tag="$repository-tts:sha-$GITHUB_SHA"
          docker tag "$TTS_ID" "$tts_tag"
          docker push "$tts_tag"
          web_digest=$(docker buildx imagetools inspect "$repository:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          tts_digest=$(docker buildx imagetools inspect "$tts_tag" --format '{{.Manifest.Digest}}')
          [[ "$web_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$tts_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "web-image=$repository@$web_digest" >> "$GITHUB_OUTPUT"
          echo "tts-image=$repository-tts@$tts_digest" >> "$GITHUB_OUTPUT"
          jq -n --arg commit "$GITHUB_SHA" --arg web "$repository@$web_digest" --arg tts "$repository-tts@$tts_digest" \
            '{commit:$commit,web:$web,tts:$tts}' > release.json

      - name: Preserve release manifest
        uses: actions/upload-artifact@v4
        with:
          name: container-release
          path: release.json
          if-no-files-found: error
          retention-days: 90
