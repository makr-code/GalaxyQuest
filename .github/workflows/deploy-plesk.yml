name: Block superseded Plesk deployment
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      web-image:
        type: string
        required: true
      tts-image:
        type: string
        required: true
permissions: {}
jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block superseded container deployment
        run: |
          echo "::error::Legacy push deployment is disabled; the native server-side pull deployment is not ready."
          exit 1
