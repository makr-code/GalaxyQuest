name: WordPress Plugin Release

on:
  push:
    tags: ['gq-deployment-status-v*', 'gq-game-admin-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable gq-deployment-status-vX.Y.Z or gq-game-admin-vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/wordpress-plugin'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: gq_admin_connection
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      sha: ${{ steps.package.outputs.sha }}
      version: ${{ steps.package.outputs.version }}
      slug: ${{ steps.source.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, mbstring, pdo_sqlite, mysqli, pdo_mysql
          coverage: none

      - name: Validate stable plugin source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(gq-deployment-status|gq-game-admin)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          SLUG="${BASH_REMATCH[1]}"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            git merge-base --is-ancestor HEAD origin/release/wordpress-plugin
          fi
          php -l "wordpress-integration/$SLUG.php"
          php -l wordpress-integration/gq-github-plugin-updater.php
          php -l scripts/package_wordpress_plugin.php
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Install locked test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Verify plugin updater and canonical package contract
        env:
          GQ_GAME_ADMIN_CONNECTION_TEST_DSN: mysql:host=127.0.0.1;dbname=gq_admin_connection;charset=utf8mb4
        run: |
          vendor/bin/phpunit --no-configuration tests/Unit/WordPressDeploymentStatusTest.php
          vendor/bin/phpunit --no-configuration tests/Unit/WordPressGameAdministrationTest.php
          vendor/bin/phpunit --no-configuration tests/Unit/WordPressPluginPackageTest.php

      - name: Prepare independent WordPress plugin assets
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SLUG: ${{ steps.source.outputs.slug }}
          OUTPUT: ${{ runner.temp }}/wordpress-plugin
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          mkdir -m 700 "$OUTPUT"
          php scripts/package_wordpress_plugin.php "$RELEASE_TAG" "$SHA" "$OUTPUT"
          VERSION="${RELEASE_TAG#${SLUG}-v}"
          (cd "$OUTPUT" && sha256sum --check "$SLUG-$VERSION.sha256")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-plugin
          path: ${{ runner.temp }}/wordpress-plugin/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: wordpress-plugin-release
    concurrency:
      group: wordpress-plugin-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wordpress-plugin
          path: wordpress-plugin

      - name: Publish verified plugin assets without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SLUG: ${{ needs.prepare.outputs.slug }}
        working-directory: wordpress-plugin
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$SLUG-v$VERSION"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          ZIP="$SLUG-$VERSION.zip"
          CHECKSUM="$SLUG-$VERSION.sha256"
          MANIFEST="$SLUG-$VERSION.release.json"
          sha256sum --check "$CHECKSUM"
          DIGEST="sha256:$(sha256sum "$ZIP" | cut -d ' ' -f 1)"
          SIZE="$(stat -c '%s' "$ZIP")"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" --arg version "$VERSION" --arg plugin "$SLUG" \
            --arg zip "$ZIP" --arg digest "$DIGEST" --argjson size "$SIZE" \
            '.schema_version == 1 and .repository == "makr-code/GalaxyQuest"
             and .plugin == $plugin and .version == $version
             and .tag == $tag and .commit == $commit
             and .package == {name:$zip,digest:$digest,size_in_bytes:$size}' "$MANIFEST"
          PLUGIN_NAME='GalaxyQuest Deployment Status'
          if [ "$SLUG" = gq-game-admin ]; then PLUGIN_NAME='GalaxyQuest Administration'; fi
          printf '%s %s\n\nWordPress plugin only; no game deployment.\n' "$PLUGIN_NAME" "$VERSION" > notes.txt
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' releases.json > existing.json
          COUNT="$(jq length existing.json)"
          if [ "$COUNT" != 0 ]; then
            test "$COUNT" = 1
            jq -e --arg zip "$ZIP" --arg checksum "$CHECKSUM" --arg manifest "$MANIFEST" \
              --arg digest "$DIGEST" --rawfile notes notes.txt \
              '.[0] | .draft == false and .prerelease == false
               and (.body | rtrimstr("\n")) == ($notes | rtrimstr("\n"))
               and ([.assets[].name] | sort) == ([$zip,$checksum,$manifest] | sort)
               and all(.assets[]; .state == "uploaded" and .size > 0)
               and any(.assets[]; .name == $zip and .digest == $digest)' existing.json
            mkdir "$RUNNER_TEMP/existing-plugin"
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$RUNNER_TEMP/existing-plugin"
            for ASSET in "$ZIP" "$CHECKSUM" "$MANIFEST"; do
              cmp --silent "$ASSET" "$RUNNER_TEMP/existing-plugin/$ASSET"
            done
            echo "::notice::Matching plugin release already exists; nothing overwritten."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$ZIP" "$CHECKSUM" "$MANIFEST" \
            --repo "$GH_REPO" --verify-tag --target "$RELEASE_SHA" \
            --draft --latest=false --title "$PLUGIN_NAME $VERSION" --notes-file notes.txt
          # The by-tag endpoint does not expose drafts; select the authenticated list entry.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > draft-releases.json
          jq --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)] |
             if length == 1 then .[0] else error("Expected one uploaded plugin draft") end' \
            draft-releases.json > uploaded.json
          jq -e --arg zip "$ZIP" --arg digest "$DIGEST" --argjson size "$SIZE" \
            '.draft == true and any(.assets[];
             .name == $zip and .state == "uploaded" and .digest == $digest and .size == $size)' uploaded.json
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest=false
